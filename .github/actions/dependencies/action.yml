name: "Install the Dependencies of the GUI Layer"
description: >-
  Qt, the build tools and ccache for building OpenMS-TOPP-GUI.
  The OpenMS core itself comes from the openms-core action.
inputs:
  compiler:
    description: "The name of the compiler to use (cl.exe, xcode, g++, clang++)"
    required: true
  doc:
    description: "'true' also installs doxygen for the documentation"
    required: false
    default: "false"
outputs:
  cmake_prefix:
    description: "Paths to add to CMAKE_PREFIX_PATH (';'-separated, may be empty)"
    value: ${{ steps.deps-windows.outputs.cmake_prefix }}${{ steps.deps-linux.outputs.cmake_prefix }}${{ steps.deps-macos.outputs.cmake_prefix }}
runs:
  using: "composite"
  steps:
    - name: Install Qt (Windows)
      if: runner.os == 'Windows'
      uses: jurplel/install-qt-action@v4
      with:
        version: '6.8.3'    ## Qt 6.8.3 ships no msvc2026 build; the win64_msvc2022_64 binaries are
                            ## ABI-compatible with the VS2026 (v145) toolchain (shared v14x ABI).
        arch: 'win64_msvc2022_64'
        cache: 'false'
        archives: 'qtsvg qtimageformats qtbase'

    - name: "Dependencies: Windows"
      id: deps-windows
      if: runner.os == 'Windows'
      shell: bash
      env:
        DOC: ${{ inputs.doc }}
      run: |
        args=()
        if [[ "$DOC" != "true" ]]; then
          args+=(--skip-doc-deps)
        fi
        bash tools/ci/deps-windows.sh "${args[@]}"
        echo "C:\Program Files (x86)\NSIS" >> "$GITHUB_PATH"
        # install-qt-action puts Qt's bin/ on PATH, which CMake searches; naming the
        # prefix as well makes the lookup independent of that
        echo "cmake_prefix=$(cygpath -m "$QT_ROOT_DIR")" >>"$GITHUB_OUTPUT"

    - name: "Dependencies: Linux"
      id: deps-linux
      if: runner.os == 'Linux'
      shell: bash
      env:
        COMPILER: ${{ inputs.compiler }}
        DOC: ${{ inputs.doc }}
      run: |
        args=()
        if [[ "$DOC" != "true" ]]; then
          args+=(--skip-doc-deps)
        fi
        bash tools/ci/deps-ubuntu.sh "${args[@]}"

        if [[ "$COMPILER" == clang* ]]; then
          major_ver=$(clang -dumpversion | cut -d. -f1)
          sudo apt-get -qq install -y "llvm-${major_ver}"
          for tool in /usr/bin/llvm-*-"${major_ver}"; do
            base=$(basename "$tool" "-${major_ver}")
            sudo ln -sf "$tool" "/usr/local/bin/${base}"
          done
        fi

        echo "cmake_prefix=" >>"$GITHUB_OUTPUT"

    - name: "Dependencies: macOS"
      id: deps-macos
      if: runner.os == 'macOS'
      env:
        # otherwise brew updates the preinstalled packages that depend on what it installs
        HOMEBREW_NO_INSTALLED_DEPENDENTS_CHECK: 1
        DOC: ${{ inputs.doc }}
      shell: bash
      run: |
        args=()
        if [[ "$DOC" != "true" ]]; then
          args+=(--skip-doc-deps)
        fi
        bash tools/ci/deps-macos.sh "${args[@]}"

        brew_path=$(brew --prefix)
        echo "$brew_path/bin" >>"$GITHUB_PATH"
        echo "cmake_prefix=$brew_path" >>"$GITHUB_OUTPUT"
