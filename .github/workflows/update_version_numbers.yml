name: Update the version number

# After a release tag vX.Y[.Z], open a pull request against develop that sets the
# next minor version (X.Y+1.0) with tools/update_version_numbers.sh. The version of
# this repository is always that of the OpenMS core it is built against, so the
# pull request is merged when OpenMS develop has moved to the same version.
on:
  push:
    tags:
      - 'v[0-9]*'

permissions:
  contents: write
  pull-requests: write

jobs:
  updating_package_version_number:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout develop branch
        uses: actions/checkout@v6
        with:
          ref: develop

      - name: Calculate next minor version and update files
        env:
          TAG_NAME: ${{ github.ref_name }}
        run: |
          echo "Triggered by tag: $TAG_NAME"

          # v<major>.<minor> with an optional .<patch>; anything else (e.g. a
          # release candidate) is not a release
          if [[ "$TAG_NAME" =~ ^v([0-9]+)\.([0-9]+)(\.[0-9]+)?$ ]]; then
            MAJOR="${BASH_REMATCH[1]}"
            MINOR="${BASH_REMATCH[2]}"
            PATCH="${BASH_REMATCH[3]#.}"
          else
            echo "Tag '$TAG_NAME' is not a release (vX.Y or vX.Y.Z); nothing to do."
            exit 0
          fi

          NEW_MAJOR="$MAJOR"
          NEW_MINOR=$((MINOR + 1))
          NEW_PATCH=0
          NEW_VERSION=${NEW_MAJOR}.${NEW_MINOR}.${NEW_PATCH}

          echo "Bumping version from $MAJOR.$MINOR.${PATCH:-0} to $NEW_VERSION"

          bash tools/update_version_numbers.sh "$NEW_MAJOR" "$NEW_MINOR" "$NEW_PATCH"

          echo "NEW_VERSION=$NEW_VERSION" >> "$GITHUB_ENV"

      - name: Commit, Push, and PR
        if: env.NEW_VERSION != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BRANCH_NAME: update_package_number
          TAG_NAME: ${{ github.ref_name }}
          ACTOR: ${{ github.actor }}
        run: |
          # Nothing changed: no pull request.
          if git diff --exit-code; then
            echo "No changes detected. Skipping PR creation."
            exit 0
          fi

          FULL_BRANCH_NAME=${BRANCH_NAME}_${NEW_VERSION}

          git config --global user.name "$ACTOR"
          git config --global user.email "${ACTOR}@users.noreply.github.com"

          git checkout -b "$FULL_BRANCH_NAME"
          git add .
          git commit -m "Updated OpenMS-TOPP-GUI version number to $NEW_VERSION"

          # force push, so an open pull request of this branch is brought up to date
          git push origin "$FULL_BRANCH_NAME" --force

          PR_EXISTS=$(gh pr list --head "$FULL_BRANCH_NAME" --base develop --state open --json number --jq '.[].number')

          if [ -z "$PR_EXISTS" ]; then
            gh pr create \
              --title "[GHA] Updated OpenMS-TOPP-GUI version number to $NEW_VERSION" \
              --body "This PR was automatically generated by GitHub Actions following the tag push of **$TAG_NAME** to bump the version number on \`develop\` to $NEW_VERSION. Merge it once OpenMS develop is at $NEW_VERSION as well: this repository is built against the OpenMS core of the same version." \
              --base develop \
              --head "$FULL_BRANCH_NAME"
          else
            echo "PR #${PR_EXISTS} already exists for branch $FULL_BRANCH_NAME. Branch was force-pushed; PR is now up to date."
          fi
